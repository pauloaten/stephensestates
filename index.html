<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Property Management | Stephens Estates</title>
  <meta name="description" content="Premium property management services, delivered with discretion and care." />
  <meta property="og:title" content="Stephens Estates" />
  <meta property="og:description" content="Premium property management services, delivered with discretion and care." />
  <meta property="og:image" content="stephens-estates-logo.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="stephens-estates-logo-removebg.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #2B5A58;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .logo {
      width: min(520px, 92vw);
      height: auto;
      margin-bottom: 1rem;
    }

    p {
      color: #e8cfa6;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      letter-spacing: 0.06em;
      line-height: 1.8;
      text-align: center;
      max-width: 480px;
      opacity: 0.85;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
    }

    .coming-soon {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #D4AF82;
      opacity: 0.55;
    }
  </style>
</head>
<body>

  <h1 class="visually-hidden">Stephens Estates</h1>
  <img class="logo" src="stephens-estates-logo-removebg.png" alt="Stephens Estates" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'" />
  <p id="logo-fallback" style="display:none;font-size:2rem;letter-spacing:0.2em;text-transform:uppercase;color:#D4AF82;">Stephens Estates</p>

  <p>Premium property &amp; garden management services, delivered with discretion and care. RHS qualified.</p>

  <p style="white-space: nowrap; font-size: clamp(0.65rem, 2.2vw, 1rem); max-width: 100%;">London &middot; Somerset &middot; Dorset &middot; Devon &middot; Wiltshire &middot; Hampshire</p>

  <p class="coming-soon">Website coming soon</p>

</body>
</html>
