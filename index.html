<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephens Estates</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #2B5A58;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .logo {
      width: min(520px, 92vw);
      height: auto;
      margin-bottom: 2.5rem;
    }

    .rule {
      width: 48px;
      height: 1px;
      background: #D4AF82;
      opacity: 0.6;
      margin: 0 auto 2rem;
    }

    p {
      color: #e8cfa6;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      letter-spacing: 0.06em;
      line-height: 1.8;
      text-align: center;
      max-width: 480px;
      opacity: 0.85;
    }

    .coming-soon {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #D4AF82;
      opacity: 0.55;
    }
  </style>
</head>
<body>

  <img class="logo" src="stephens-estates-logo.png" alt="Stephens Estates" />

  <div class="rule"></div>

  <p>Premium property management services, delivered with discretion and care.</p>

  <p class="coming-soon">Website coming soon</p>

</body>
</html>
